services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: skillsync-backend
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://pylupxecznfdwnurlyvj.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # 2. React Frontend Static Site
  - type: static
    name: skillsync-frontend
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
