services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: skillsync-backend
    env: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://pylupxecznfdwnurlyvj.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # 2. React Frontend Static Site
  - type: web
    name: skillsync-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
